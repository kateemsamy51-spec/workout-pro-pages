<title>دفتر التمرين | كريم سامي</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=Cairo:wght@400;600;800&family=JetBrains+Mono:wght@500&display=swap">
<style>
/* Layout: a gym logbook. Sticky day tabs on top, one card per exercise, rest timer docked at the bottom. */
:root{
  --bg:#E9ECEA; --surface:#F6F7F5; --ink:#15191C; --muted:#586671; --line:#C9D0CC;
  --accent:#C8321A; --on-accent:#FFFFFF; --ok:#1E7A4C; --body:#D3D8D5; --muscle:#B6BEBA;
  --f-disp:"Barlow Condensed","Cairo",system-ui,sans-serif;
  --f-body:"Cairo",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-mono:"JetBrains Mono",ui-monospace,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0F1214; --surface:#181C1F; --ink:#ECEFEA; --muted:#9AA5AD; --line:#2A3034;
    --accent:#FF6B3F; --on-accent:#14181B; --ok:#4CC38A; --body:#262C30; --muscle:#363D42; color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0F1214; --surface:#181C1F; --ink:#ECEFEA; --muted:#9AA5AD; --line:#2A3034;
  --accent:#FF6B3F; --on-accent:#14181B; --ok:#4CC38A; --body:#262C30; --muscle:#363D42; color-scheme:dark;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{
  background:var(--bg); color:var(--ink); font-family:var(--f-body); font-size:16px; line-height:1.6;
  padding-block:0 28px;
  padding-left:max(16px, env(safe-area-inset-left, 0px));
  padding-right:max(16px, env(safe-area-inset-right, 0px));
}
body.resting{padding-block-end:110px}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--bg);z-index:30}
.wrap{max-width:640px;margin-inline:auto}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--bg);padding-block:14px 10px;border-bottom:1px solid var(--line)}
.brand{display:flex;align-items:baseline;justify-content:space-between;gap:12px;margin-bottom:10px}
.brand h1{margin:0;font-size:1.35rem;font-weight:800;letter-spacing:0}
.brand .date{font-size:.85rem;color:var(--muted)}
.tabs{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.tab{background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:7px 4px;text-align:center;line-height:1.25;min-width:0}
.tab b{display:block;font-size:.95rem;font-weight:800}
.tab small{display:block;font-size:.72rem;color:var(--muted)}
.tab[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.tab[aria-pressed="true"] small{color:inherit;opacity:.85}
.bar{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:8px 12px;margin-top:10px}
.seg{display:flex;gap:4px}
.seg button{background:transparent;border:1px solid var(--line);border-radius:6px;padding:3px 10px;font-size:.85rem;color:var(--muted)}
.seg button[aria-pressed="true"]{border-color:var(--ink);color:var(--ink);font-weight:600}
.progress{font-family:var(--f-mono);font-size:.85rem;color:var(--muted)}
.progress b{color:var(--ink)}

.views{display:flex;gap:18px;margin-top:10px}
.views button{background:none;border:0;border-bottom:2px solid transparent;padding:2px 0;font-weight:600;color:var(--muted)}
.views button[aria-pressed="true"]{color:var(--ink);border-color:var(--accent)}

main{display:flex;flex-direction:column;gap:14px;padding-top:16px}
.banner{background:var(--surface);border:1px solid var(--line);border-inline-start:4px solid var(--accent);border-radius:6px;padding:10px 12px;font-size:.9rem}
.toggle{display:flex;align-items:center;justify-content:space-between;gap:12px;background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:8px 12px;font-size:.92rem}
.switch{flex:none;width:44px;height:26px;border-radius:13px;border:1px solid var(--line);background:var(--bg);position:relative;padding:0}
.switch::after{content:"";position:absolute;top:2px;inset-inline-start:2px;width:20px;height:20px;border-radius:50%;background:var(--muted);transition:transform .15s}
.switch[aria-pressed="true"]{background:var(--accent);border-color:var(--accent)}
.switch[aria-pressed="true"]::after{background:var(--on-accent);transform:translateX(-18px)}

.ex{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:14px;display:flex;flex-direction:column;gap:10px;min-width:0}
.ex-head{display:flex;justify-content:space-between;gap:12px;align-items:flex-start}
.ex-title{min-width:0}
.ex h3{margin:0;font-family:var(--f-disp);font-size:1.6rem;line-height:1.1;font-weight:700;text-wrap:balance;direction:ltr;text-align:start;unicode-bidi:isolate}
.ar{font-size:.98rem;font-weight:600;color:var(--muted);margin-top:2px}
.tab.restday{border-style:dashed}
.grp{margin:10px 0 0;font-size:1.05rem;font-weight:800}
.acts{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.donebtn{display:inline-flex;align-items:center;gap:8px;height:46px;padding:0 20px;border-radius:6px;border:1px solid var(--line);background:var(--bg);font-weight:600}
.donebtn svg{width:22px;height:22px;stroke:var(--muted);fill:none;stroke-width:2.5;stroke-linecap:round;stroke-linejoin:round}
.donebtn[aria-pressed="true"]{background:var(--ok);border-color:var(--ok);color:#fff}
.donebtn[aria-pressed="true"] svg{stroke:#fff}
.target{margin:4px 0 0;font-size:.85rem;color:var(--muted)}
.target b{font-family:var(--f-mono);font-weight:500;color:var(--ink)}
.fig{flex:none;width:112px;margin:0}
.fig svg{display:block;width:100%;height:auto}
.fig .base{fill:var(--body)} .fig .m{fill:var(--muscle)} .fig .m.on{fill:var(--accent)}
.fig text{font-family:var(--f-body);font-size:9px;fill:var(--muted)}
.chips{display:flex;flex-wrap:wrap;gap:4px;margin:6px 0 0;padding:0;list-style:none}
.chips li{font-size:.72rem;border:1px solid var(--accent);color:var(--accent);border-radius:4px;padding:0 6px;line-height:1.5}
.cue{margin:0;font-size:.9rem}
.last{font-size:.82rem;color:var(--muted);display:flex;flex-wrap:wrap;gap:4px 10px;align-items:center}
.last .nums{font-family:var(--f-mono);direction:ltr;unicode-bidi:isolate}
.up{background:var(--ok);color:#fff;border-radius:4px;padding:0 7px;font-weight:600;font-size:.78rem}
:root[data-theme="dark"] .up{color:#08140E}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .up{color:#08140E}}

.sets{display:flex;flex-direction:column;gap:6px}
.set{display:grid;grid-template-columns:34px minmax(0,1fr) 14px minmax(0,1fr) 46px;align-items:center;gap:6px}
.set .n{font-family:var(--f-mono);font-size:.85rem;color:var(--muted);text-align:center}
.set .x{text-align:center;color:var(--muted);font-family:var(--f-mono)}
.set label{position:relative;display:block;min-width:0}
.set input{width:100%;height:46px;background:var(--bg);color:var(--ink);border:1px solid var(--line);border-radius:6px;font-family:var(--f-mono);font-size:1.1rem;text-align:center;padding:0 24px 0 4px;direction:ltr}
.set input::placeholder{color:var(--muted);opacity:.65}
.set label span{position:absolute;inset-inline-end:6px;top:50%;transform:translateY(-50%);font-size:.7rem;color:var(--muted);pointer-events:none}
.chk{height:46px;border-radius:6px;border:1px solid var(--line);background:var(--bg);display:grid;place-items:center;padding:0}
.chk svg{width:22px;height:22px;stroke:var(--muted);fill:none;stroke-width:2.5;stroke-linecap:round;stroke-linejoin:round}
.chk[aria-pressed="true"]{background:var(--ok);border-color:var(--ok)}
.chk[aria-pressed="true"] svg{stroke:#fff}
.set.done input{border-color:var(--ok)}
.demo{align-self:flex-start;font-size:.85rem;color:var(--accent);text-underline-offset:3px}

.savebar{display:flex;justify-content:center;padding-top:6px}
.btn{background:var(--accent);color:var(--on-accent);border:0;border-radius:8px;padding:12px 28px;font-weight:800;font-size:1.05rem}
.btn.ghost{background:transparent;color:var(--muted);border:1px solid var(--line);padding:4px 12px;font-size:.82rem;font-weight:600}
.btn.danger{color:var(--accent);border-color:var(--accent)}

.sess{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:12px 14px;display:flex;flex-direction:column;gap:8px}
.sess header{display:flex;justify-content:space-between;align-items:center;gap:8px}
.sess h3{margin:0;font-size:1.05rem;font-weight:800}
.sess .d{font-size:.82rem;color:var(--muted)}
.sess ul{margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:2px;font-size:.88rem}
.sess li{display:flex;justify-content:space-between;gap:12px}
.sess li span:first-child{direction:ltr;unicode-bidi:isolate}
.sess li span:last-child{font-family:var(--f-mono);direction:ltr;unicode-bidi:isolate;color:var(--muted);text-align:end}
.empty{text-align:center;color:var(--muted);padding:36px 12px;border:1px dashed var(--line);border-radius:10px}

.rest{position:fixed;inset:auto 0 0 0;z-index:25;background:var(--surface);border-top:2px solid var(--accent);padding:10px max(16px, env(safe-area-inset-left,0px)) calc(10px + env(safe-area-inset-bottom,0px)) max(16px, env(safe-area-inset-right,0px))}
.rest-in{max-width:640px;margin-inline:auto;display:flex;flex-direction:column;gap:8px}
.rest-row{display:flex;align-items:center;justify-content:space-between;gap:10px}
.rest-time{font-family:var(--f-disp);font-weight:700;font-size:2.4rem;line-height:1;letter-spacing:.02em;direction:ltr}
.rest-lbl{font-size:.85rem;color:var(--muted)}
.rest-btns{display:flex;gap:6px}
.track{height:5px;background:var(--line);border-radius:3px;overflow:hidden}
.fill{height:100%;width:100%;background:var(--accent);transform-origin:right center}
.toast{position:fixed;inset-inline:0;bottom:calc(90px + env(safe-area-inset-bottom,0px));display:flex;justify-content:center;pointer-events:none;z-index:40}
.toast div{background:var(--ink);color:var(--bg);padding:8px 16px;border-radius:8px;font-weight:600;font-size:.92rem}
@media (prefers-reduced-motion:no-preference){.fill{transition:transform .25s linear}}
.card{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:14px;display:flex;flex-direction:column;gap:10px;min-width:0}
.card h2{margin:0;font-size:1.12rem;font-weight:800;line-height:1.35}
.card .sub{margin:0;font-size:.85rem;color:var(--muted)}
.card .sub b{color:var(--ink)}
.kpis{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.kpi{background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:8px 4px;text-align:center;min-width:0}
.kpi b{display:block;font-family:var(--f-mono);font-weight:500;font-size:1.15rem;direction:ltr;unicode-bidi:isolate}
.kpi span{font-size:.72rem;color:var(--muted)}
.wk{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:4px}
.wk div{border:1px solid var(--line);border-radius:6px;background:var(--bg);text-align:center;padding:6px 0 4px;font-size:.68rem;line-height:1.3;min-width:0}
.wk div b{display:block;font-size:1rem;font-family:var(--f-mono);font-weight:500}
.wk .done{border-color:var(--ok);color:var(--ok)}
.wk .missed{border-color:var(--accent);color:var(--accent)}
.wk .today{outline:2px solid var(--ink);outline-offset:1px}
.wk .future{color:var(--muted)}
.tasks{display:flex;flex-direction:column}
.task{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:8px 0;border-top:1px solid var(--line);font-size:.92rem}
.task:first-child{border-top:0}
.task .tl{min-width:0}
.task .tl small{display:block;color:var(--muted);font-size:.74rem}
.qrow{display:flex;gap:6px;align-items:center}
.qrow input{width:84px;height:40px}
.note{border-inline-start-color:var(--muted)}
.note.good{border-inline-start-color:var(--ok)}
.note.warn{border-inline-start-color:var(--accent)}
.flds{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.flds.three{grid-template-columns:repeat(3,minmax(0,1fr))}
.fld{display:flex;flex-direction:column;gap:4px;font-size:.82rem;color:var(--muted);min-width:0}
.fld input,.fld select,.qrow input{height:44px;width:100%;background:var(--bg);color:var(--ink);border:1px solid var(--line);border-radius:6px;font-family:var(--f-mono);font-size:1rem;padding:0 8px;text-align:center;direction:ltr}
.fld select{font-family:var(--f-body);direction:rtl;text-align:start}
.fld input[type="date"]{font-size:.9rem}
.chart{display:block;width:100%;height:auto;direction:ltr}
.ch-grid{stroke:var(--line);stroke-width:1;fill:none}
.ch-t{fill:var(--muted);font-family:var(--f-mono);font-size:9px}
.ch-lab{fill:var(--ink);font-family:var(--f-mono);font-size:10px;font-weight:500}
.ch-line{fill:none;stroke:var(--accent);stroke-width:2.2;stroke-linejoin:round;stroke-linecap:round}
.ch-dot{fill:var(--muted);fill-opacity:.7}
.ch-end{fill:var(--accent)}
.tbl{width:100%;border-collapse:collapse;font-size:.82rem}
.tbl th,.tbl td{padding:5px 3px;border-top:1px solid var(--line);text-align:center;font-weight:500}
.tbl th{color:var(--muted);font-size:.72rem;border-top:0}
.tbl td{font-family:var(--f-mono);direction:ltr}
.tbl td:first-child,.tbl th:first-child{text-align:start;font-family:var(--f-body)}
.tbl .dl{display:block;font-size:.68rem;color:var(--muted)}
.tbl .up2{color:var(--ok)}
.rowbtns{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.list{display:flex;flex-direction:column;gap:2px;font-size:.85rem;margin:0;padding:0;list-style:none}
.list li{display:flex;justify-content:space-between;gap:10px;align-items:center}
.list li span:nth-child(2){font-family:var(--f-mono);direction:ltr}
.badges{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.badge{border:1px solid var(--ok);border-radius:8px;padding:8px 10px;font-size:.82rem;line-height:1.35}
.badge b{display:block;font-size:.9rem}
.badge.off{border-color:var(--line);color:var(--muted)}
.macro{display:flex;flex-direction:column;gap:10px}
.macro .m1{display:grid;grid-template-columns:auto 1fr;gap:2px 10px;align-items:center}
.macro .m1 b{font-family:var(--f-mono);font-weight:500;direction:ltr;text-align:end}
.macro .bar2{grid-column:1/-1;height:8px;background:var(--line);border-radius:4px;overflow:hidden}
.macro .bar2 i{display:block;height:100%;background:var(--accent);border-radius:4px}
.big{font-family:var(--f-disp);font-weight:700;font-size:3rem;line-height:1;direction:ltr;text-align:center}
.shareimg{display:block;width:100%;max-width:300px;margin-inline:auto;border:1px solid var(--line);border-radius:10px;background:var(--bg)}
.chk2{display:flex;align-items:center;gap:8px;font-size:.92rem}
.chk2 input{width:20px;height:20px}
.views{flex-wrap:wrap;gap:6px 14px}
.views button{font-size:.92rem}
body:not(.v-train) .tabs,body:not(.v-train) .bar{display:none}

.views{flex-wrap:wrap;gap:6px 14px}
body:not(.v-train) .tabs, body:not(.v-train) .bar{display:none}
</style>

<div class="wrap">
  <header class="top">
    <div class="brand"><h1>دفتر التمرين</h1><span class="date" id="today"></span></div>
    <div class="tabs" id="tabs"></div>
    <div class="bar">
      <div class="seg" id="restseg" aria-label="مدة الراحة"></div>
      <div class="progress" id="prog"></div>

function cloudPush(force){

var restEnd = 0, restTotal = 0, restTick = null, actx = null;
function beep(){
  try{
    actx = actx || new (window.AudioContext||window.webkitAudioContext)();
    [0,0.25,0.5].forEach(function(t){
      var o = actx.createOscillator(), g = actx.createGain();
      o.type = "sine"; o.frequency.value = 880; g.gain.value = 0.15;
      o.connect(g); g.connect(actx.destination);
      o.start(actx.currentTime+t); o.stop(actx.currentTime+t+0.15);
    });
  }catch(e){}
  try{ if(navigator.vibrate) navigator.vibrate([200,100,200]); }catch(e){}
}

  $("restlbl").textContent = label || "راحة";
  clearInterval(restTick); restTick = setInterval(tick, 250); tick();

}
function tick(){
  var left = Math.ceil((restEnd-Date.now())/1000);
  if(left<=0){
    clearInterval(restTick); restTick = null;
    $("resttime").textContent = "0:00"; $("restfill").style.transform = "scaleX(0)";
    $("restlbl").textContent = holdMode ? "خلص الوقت" : "خلصت الراحة، ابدأ المجموعة الجاية";
    beep();
    setTimeout(function(){ if(!restTick) stopRest(); }, 5000);
    return;
  }
  $("resttime").textContent = mmss(left);
  $("restfill").style.transform = "scaleX("+Math.min(1,left/restTotal)+")";
  var adhkar=["سبحان الله","الحمد لله","أستغفر الله","لا إله إلا الله","اللهم صلِّ وسلم على نبينا محمد"],zi=$("restzikr");if(zi)zi.textContent=adhkar[Math.floor((restTotal-left)/12)%adhkar.length];
}

/* ---------- events ---------- */
document.addEventListener("click", function(ev){
  var b = ev.target.closest("[data-act]"); if(!b) return;
  var a = b.getAttribute("data-act");
  if(a==="day"){ dayIdx = +b.getAttribute("data-i"); S.prefs.day = dayIdx; persist(); view = "train"; renderAll(); window.scrollTo(0,0); }
  else if(a==="view"){ view = b.getAttribute("data-v"); pendingDel = null; renderAll(); window.scrollTo(0,0); }
  else if(a==="rest"){ S.prefs.rest = +b.getAttribute("data-s"); persist(); renderTabs(); }
  
  else if(a==="check"){
    var d = draftFor(DAYS[dayIdx]), x = d[b.getAttribute("data-ex")][+b.getAttribute("data-i")];
    x.d = !x.d; persist();
    b.setAttribute("aria-pressed", x.d);
    b.closest(".set").classList.toggle("done", x.d);
    updateProgress();
    if(x.d){ var exo = null; DAYS[dayIdx].ex.forEach(function(q){ if(q.id===b.getAttribute("data-ex")) exo = q; }); startRest(exo && exo.rest ? exo.rest : S.prefs.rest); }
  }
  else if(a==="rest-add"){ restEnd += (+b.getAttribute("data-s"))*1000; restTotal += (+b.getAttribute("data-s")); if(!restTick){ restTick = setInterval(tick,250); } tick(); }
  else if(a==="rest-skip"){ stopRest(); }
  else if(a==="rcheck"){ var dd = draftFor(DAYS[dayIdx]), rid = b.getAttribute("data-ex"); dd[rid] = !dd[rid]; persist(); b.setAttribute("aria-pressed", !!dd[rid]); updateProgress(); }
  else if(a==="hold"){ startRest(+b.getAttribute("data-s"), "ثبات"); }
  else if(a==="save"){ saveSession(); }
  else if(a==="del"){
    var id = +b.getAttribute("data-id");
    if(pendingDel===id){ S.sessions = S.sessions.filter(function(s){ return s.id!==id; }); pendingDel = null; persist(); toast("اتحذف"); }
    else pendingDel = id;
    renderAll();
  }
});
document.addEventListener("input", function(ev){
  var t = ev.target; if(!t.matches || !t.matches("input[data-ex]")) return;
  var v = t.value.replace(",",".").replace(/[^0-9.]/g,"");
  if(t.getAttribute("data-f")==="r") v = v.replace(/\./g,"");
  if(v!==t.value) t.value = v;
  var d = draftFor(DAYS[dayIdx]);
  d[t.getAttribute("data-ex")][+t.getAttribute("data-i")][t.getAttribute("data-f")] = v;
  persist();
});

function saveSession(){
  var day = DAYS[dayIdx], d = draftFor(day), sets = {}, n = 0;
  if(day.rest){
    var done = visibleEx(day).filter(function(e){ return d[e.id]; }).map(function(e){ return e.id; });
    if(!done.length){ toast("علّم مهمة واحدة على الأقل"); return; }
    var k2 = todayKey();
    S.sessions = S.sessions.filter(function(s){ return !(s.date===k2 && s.day===day.id); });
    S.sessions.unshift({id:Date.now(), date:k2, day:day.id, sets:{}, done:done});
    S.sessions.sort(function(a,b){ return a.date<b.date?1:a.date>b.date?-1:b.id-a.id; });
    delete S.draft[day.id];
    persist(); stopRest(); toast("الحمد لله، خلّصت مهام النهارده. عاش يا بطل."); renderAll(); window.scrollTo(0,0); return;
  }
  visibleEx(day).forEach(function(e){
    var arr = [];
    d[e.id].forEach(function(x){
      var w = parseFloat(x.w), r = parseInt(x.r,10);
      if((x.d || x.w!=="" || x.r!=="") && (w>0 || r>0)){ arr.push({w:isNaN(w)?0:w, r:isNaN(r)?0:r}); n++; }
    });
    if(arr.length) sets[e.id] = arr;
  });
  if(!n){ toast("سجّل مجموعة واحدة على الأقل"); return; }
  var key = todayKey();
  S.sessions = S.sessions.filter(function(s){ return !(s.date===key && s.day===day.id); });
  var prs = [];
  Object.keys(sets).forEach(function(id){
    var prev = 0; S.sessions.forEach(function(s){ if(s.sets && s.sets[id]) s.sets[id].forEach(function(x){ if(x.w>prev) prev = x.w; }); });
    var mx = 0; sets[id].forEach(function(x){ if(x.w>mx) mx = x.w; });
    if(prev>0 && mx>prev) prs.push(id);
  });
  var ns = {id:Date.now(), date:key, day:day.id, sets:sets}; if(prs.length) ns.pr = prs;
  S.sessions.unshift(ns);
  S.sessions.sort(function(a,b){ return a.date<b.date?1:a.date>b.date?-1:b.id-a.id; });
  delete S.draft[day.id];
  persist(); stopRest();
  toast(prs.length ? "الحمد لله، خلّصت التمرين وحققت رقم جديد. عاش يا بطل!" : "الحمد لله، خلّصت تمرين النهارده. عاش يا بطل، كمل على مهلك.");
  renderAll(); window.scrollTo(0,0);
}

/* ================= v2: اليوم، الجسم، الأكل، الملخص ================= */
function pk(k){ var p=k.split("-"); return new Date(+p[0],+p[1]-1,+p[2]); }
function dk(d){ return d.getFullYear()+"-"+("0"+(d.getMonth()+1)).slice(-2)+"-"+("0"+d.getDate()).slice(-2); }
function addD(k,n){ var d=pk(k); d.setDate(d.getDate()+n); return dk(d); }
function diffD(a,b){ return Math.round((pk(a)-pk(b))/86400000); }
function weekStartKey(k){ var d=pk(k); return addD(k, -((d.getDay()-5+7)%7)); }
function sd(k){ var d=pk(k); return d.getDate()+"/"+(d.getMonth()+1); }
function planIdx(k){ var dow=pk(k).getDay(); for(var i=0;i<DAYS.length;i++){ if(DAYS[i].dow===dow) return i; } return 0; }
function planLabel(i){ var d=DAYS[i]; return d.rest ? d.name : "تمرين "+d.name; }
function r1(n){ return Math.round(n*10)/10; }

function trainSessionOn(k){ return S.sessions.some(function(s){ if(s.date!==k) return false; var d=dayOf(s.day); return !!d && !d.rest; }); }
function planDoneOn(k){ var pi=planIdx(k); return S.sessions.some(function(s){ return s.date===k && s.day===DAYS[pi].id; }); }
function weekTrainCount(ws){ var n=0; for(var i=0;i<7;i++){ if(trainSessionOn(addD(ws,i))) n++; } return n; }
function weekSets(ws){ var n=0; for(var i=0;i<7;i++){ var k=addD(ws,i); S.sessions.forEach(function(s){ if(s.date===k){ var d=dayOf(s.day); if(d && !d.rest){ Object.keys(s.sets||{}).forEach(function(e){ n+=s.sets[e].length; }); } } }); } return n; }
function weekPRs(ws){ var n=0; for(var i=0;i<7;i++){ var k=addD(ws,i); S.sessions.forEach(function(s){ if(s.date===k && s.pr) n+=s.pr.length; }); } return n; }
function firstDate(){
  var m = null;
  function c(k){ if(k && (m===null || k<m)) m=k; }
  S.sessions.forEach(function(s){ c(s.date); });
  Object.keys(S.weights).forEach(c); Object.keys(S.habits).forEach(c);
  return m;
}
function firstSessionDate(){ var m=null; S.sessions.forEach(function(s){ if(m===null || s.date<m) m=s.date; }); return m; }

function calcFood(){
  var p=S.profile, kg=parseFloat(p.w)||latestAvg(), h=parseFloat(p.h), age=parseFloat(p.age);
  if(!(kg>0 && h>0 && age>0)) return null;
  var act=+p.act||1.55, bmr=10*kg+6.25*h-5*age+5, tdee=bmr*act;
  var adj={gain:250,maintain:0,cut:-400}[p.goal]; if(adj===undefined) adj=0;
  var cal=Math.round((tdee+adj)/10)*10;
  var prot=Math.round(kg*(p.goal==="cut"?2.2:1.8)), fat=Math.round(kg*0.9);
  var carb=Math.max(0, Math.round((cal-prot*4-fat*9)/4));
  return {kg:kg,bmr:Math.round(bmr),tdee:Math.round(tdee),cal:cal,prot:prot,fat:fat,carb:carb};
}
function proteinText(){ var f=calcFood(); return f ? f.prot+" جم" : "125–145 جم"; }

function dayInfo(k){
  var h=S.habits[k]||{}, pi=planIdx(k), t=[];
  t.push({id:"weigh",label:"وزن الصبح",done:S.weights[k]!=null,auto:true});
  t.push({id:"plan",label:planLabel(pi),done:planDoneOn(k),auto:true});
  t.push({id:"protein",label:"وصلت لهدف البروتين",hint:proteinText(),done:!!h.protein});
  t.push({id:"water",label:"ميه 3 لتر",done:!!h.water});
  t.push({id:"sleep",label:"نوم 7 ساعات أو أكتر",done:!!h.sleep});
  var s=0; t.forEach(function(x){ if(x.done) s++; });
  return {tasks:t,score:s,total:t.length};
}
function goodDay(k){ return dayInfo(k).score>=3; }
function curStreak(){ var k=todayKey(), n=0; if(!goodDay(k)) k=addD(k,-1); while(n<400 && goodDay(k)){ n++; k=addD(k,-1); } return n; }
function maxStreak(){
  var f=firstDate(); if(!f) return 0;
  var k=f, t=todayKey(), best=0, cur=0, g=0;
  while(k<=t && g<800){ if(goodDay(k)){ cur++; if(cur>best) best=cur; } else cur=0; k=addD(k,1); g++; }
  return best;
}
function consecWeeks(){
  var f=firstSessionDate(); if(!f) return 0;
  var fw=weekStartKey(f), ws=addD(weekStartKey(todayKey()),-7), n=0;
  while(ws>=fw && weekTrainCount(ws)>=3){ n++; ws=addD(ws,-7); }
  return n;
}
function anyFullWeek(){
  var f=firstSessionDate(); if(!f) return false;
  var ws=weekStartKey(f), end=weekStartKey(todayKey());
  while(ws<=end){ if(weekTrainCount(ws)>=4) return true; ws=addD(ws,7); }
  return false;
}
function totalSets(){ var n=0; S.sessions.forEach(function(s){ var d=dayOf(s.day); if(d && !d.rest){ Object.keys(s.sets||{}).forEach(function(e){ n+=s.sets[e].length; }); } }); return n; }

/* وزن */
function wKeys(){ return Object.keys(S.weights).sort(); }
function avg7(k){ var s=0,n=0; for(var i=0;i<7;i++){ var v=S.weights[addD(k,-i)]; if(v!=null){ s+=v; n++; } } return n ? s/n : null; }
function latestAvg(){ var ks=wKeys(); return ks.length ? avg7(ks[ks.length-1]) : null; }
function weeklyRatePct(){
  var ks=wKeys(), t=todayKey(), from=addD(t,-21);
  var pts=ks.filter(function(k){ return k>=from; }).map(function(k){ return [diffD(k,from),S.weights[k]]; });
  if(pts.length<8) return null;
  var n=pts.length, sx=0, sy=0, sxx=0, sxy=0;
  pts.forEach(function(p){ sx+=p[0]; sy+=p[1]; sxx+=p[0]*p[0]; sxy+=p[0]*p[1]; });
  var den=n*sxx-sx*sx; if(!den) return null;
  var slope=(n*sxy-sx*sy)/den;
  return {kgWeek:slope*7, pct:slope*7/(sy/n)*100};
}

/* رسم */
function niceStep(r){ var st=[0.1,0.2,0.5,1,2,5,10,20,50,100]; for(var i=0;i<st.length;i++){ if(st[i]>=r) return st[i]; } return 100; }
function chartSVG(o){
  var W=340,H=190,L=38,Rr=14,T=16,B=26, all=o.dots.concat(o.line||[]);
  var ymin=Infinity, ymax=-Infinity;
  all.forEach(function(p){ if(p[1]<ymin) ymin=p[1]; if(p[1]>ymax) ymax=p[1]; });
  var step=niceStep(Math.max(ymax-ymin,0.4)/3);
  var lo=Math.floor(ymin/step)*step, hi=Math.ceil(ymax/step)*step; if(hi===lo) hi=lo+step;
  var x0=o.x0, x1=o.x1; if(x1===x0) x1=x0+1;
  function X(v){ return L+(v-x0)/(x1-x0)*(W-L-Rr); }
  function Y(v){ return T+(hi-v)/(hi-lo)*(H-T-B); }
  var s='<svg class="chart" viewBox="0 0 '+W+' '+H+'" role="img" aria-label="'+o.label+'">';
  for(var v=lo; v<=hi+1e-9; v+=step){ var yy=Y(v); s+='<line class="ch-grid" x1="'+L+'" x2="'+(W-Rr)+'" y1="'+yy.toFixed(1)+'" y2="'+yy.toFixed(1)+'"/><text class="ch-t" x="'+(L-6)+'" y="'+(yy+3).toFixed(1)+'" text-anchor="end">'+(+v.toFixed(1))+'</text>'; }
  (o.xl||[]).forEach(function(p){ s+='<text class="ch-t" x="'+X(p[0]).toFixed(1)+'" y="'+(H-8)+'" text-anchor="'+(p[2]||"middle")+'">'+p[1]+'</text>'; });
  if(o.line && o.line.length>1) s+='<polyline class="ch-line" points="'+o.line.map(function(p){ return X(p[0]).toFixed(1)+","+Y(p[1]).toFixed(1); }).join(" ")+'"/>';
  o.dots.forEach(function(p){ s+='<circle class="ch-dot" cx="'+X(p[0]).toFixed(1)+'" cy="'+Y(p[1]).toFixed(1)+'" r="2.4"/>'; });
  var last=(o.line && o.line.length ? o.line : o.dots).slice(-1)[0];
  if(last){ var lx=X(last[0]), ly=Y(last[1]); s+='<circle class="ch-end" cx="'+lx.toFixed(1)+'" cy="'+ly.toFixed(1)+'" r="4"/><text class="ch-lab" x="'+Math.min(lx+2,W-2).toFixed(1)+'" y="'+(ly-9).toFixed(1)+'" text-anchor="end">'+(+last[1].toFixed(1))+'</text>'; }
  return s+'</svg>';
}
function weightChart(){
  var ks=wKeys(), t=todayKey(), range=S.prefs.wr===undefined ? 56 : S.prefs.wr;
  var from = range ? addD(t,-range) : (ks[0]||t);
  var sel=ks.filter(function(k){ return k>=from; });
  if(sel.length<2) return '<div class="empty">سجّل وزنك يومين على الأقل وبعدها الرسم يظهر هنا.</div>';
  var b=sel[0], x1=diffD(sel[sel.length-1],b);
  var xl=[[0,sd(b),"start"],[x1,sd(sel[sel.length-1]),"end"]];
  if(x1>=10) xl.splice(1,0,[Math.round(x1/2),sd(addD(b,Math.round(x1/2))),"middle"]);
  return chartSVG({label:"رسم الوزن اليومي ومتوسط 7 أيام",x0:0,x1:x1,xl:xl,
    dots:sel.map(function(k){ return [diffD(k,b),S.weights[k]]; }),
    line:sel.map(function(k){ return [diffD(k,b),avg7(k)]; })});
}

/* تقدم التمارين (في السجل) */
function exName(id){ for(var i=0;i<DAYS.length;i++){ for(var j=0;j<DAYS[i].ex.length;j++){ if(DAYS[i].ex[j].id===id) return AR[id]||DAYS[i].ex[j].n; } } return id; }
function exWithData(){
  var out=[];
  DAYS.forEach(function(d){ if(!d.rest) d.ex.forEach(function(e){ if(S.sessions.some(function(s){ return s.sets && s.sets[e.id] && s.sets[e.id].some(function(x){ return x.w>0; }); })) out.push(e.id); }); });
  return out;
}
function progressCard(){
  var ids=exWithData(); if(!ids.length) return "";
  var cur=S.prefs.ex; if(ids.indexOf(cur)<0) cur=ids[0];
  var pts=[];
  S.sessions.slice().reverse().forEach(function(s){
    if(s.sets && s.sets[cur]){ var m=0; s.sets[cur].forEach(function(x){ if(x.w>m) m=x.w; }); if(m>0) pts.push({k:s.date,v:m}); }
  });
  var opts=ids.map(function(id){ return '<option value="'+id+'"'+(id===cur?' selected':'')+'>'+exName(id)+'</option>'; }).join("");
  var chart='<div class="empty">سجّل التمرين ده مرتين على الأقل وبعدها الرسم يظهر.</div>';
  if(pts.length>=2){
    var b=pts[0].k, x1=diffD(pts[pts.length-1].k,b), best=0; pts.forEach(function(p){ if(p.v>best) best=p.v; });
    chart=chartSVG({label:"أعلى وزن في كل مرة",x0:0,x1:x1,xl:[[0,sd(b),"start"],[x1,sd(pts[pts.length-1].k),"end"]],dots:pts.map(function(p){ return [diffD(p.k,b),p.v]; }),line:pts.map(function(p){ return [diffD(p.k,b),p.v]; })})+
      '<p class="sub">أعلى وزن وصلت له: <b>'+best+' kg</b></p>';
  }
  return '<section class="card"><h2>تقدم التمرين</h2><label class="fld">اختار التمرين<select id="exsel">'+opts+'</select></label>'+chart+'</section>';
}

/* تحفيز */
var MSGS=["الثبات أهم من الحماس. تمرين عادي كل أسبوع أحسن من تمرين خرافي كل شهر.",
"سجّل أوزانك كل مرة. اللي بيتسجل هو اللي بيتزود.",
"العضل بيتبني في الأكل والنوم زي ما بيتبني في الجيم.",
"لو مش حاسس بحماس، ابدأ بأول تمرين بس. بعده هتكمل.",
"المهم اتجاه الأسابيع مش رقم يوم واحد.",
"الراحة جزء من البرنامج، مش تفريط.",
"ركّز على الأداء النضيف الأول والوزن بييجي بعدين.",
"3 مهام من 5 كفاية عشان اليوم يتحسب يوم جيد."];
function coachNotes(){
  var t=todayKey(), ws=weekStartKey(t), f=firstSessionDate(), out=[];
  if(f){
    var missed=[];
    for(var i=0;i<DAYS.length;i++){ var k=addD(ws,i); if(!DAYS[i].rest && k<t && k>=f && !planDoneOn(k)) missed.push(DAYS[i].name+" ("+DAYS[i].wd+")"); }
    if(missed.length) out.push({t:"warn",x:"فاتك: "+missed.join("، ")+". ماتضاعفش التمرين اللي بعده. كمّل على الجدول وابدأ التمرين الجاي من غير ما تعوّض."});
  }
  var cw=consecWeeks();
  if(cw>=6) out.push({t:"warn",x:"بقالك "+cw+" أسابيع ملتزم. فكّر في أسبوع أخف (نفس التمارين بنص المجموعات) قبل ما تقف أوزانك."});
  var gk=wKeys(); 
  if(gk.length && diffD(t,gk[gk.length-1])>=3) out.push({t:"warn",x:"ماوزنتش نفسك بقالك "+diffD(t,gk[gk.length-1])+" أيام. الوزن اليومي هو اللي بيوضّح الاتجاه."});
  var lm=S.meas.length ? S.meas[S.meas.length-1].date : null;
  if(lm && diffD(t,lm)>=14) out.push({t:"warn",x:"عدّى "+diffD(t,lm)+" يوم على آخر قياس للجسم. وقت قياس جديد (تاب الجسم)."});
  var rt=weeklyRatePct();
  if(rt){
    var g=S.profile.goal||"gain";
    if(g==="gain" && rt.pct<0.1) out.push({t:"warn",x:"متوسط وزنك ثابت أو بينزل ("+r1(rt.kgWeek)+" كجم في الأسبوع) وهدفك تزيد. زوّد 150–200 سعرة."});
    else if(g==="gain" && rt.pct>0.6) out.push({t:"warn",x:"بتزيد بسرعة ("+r1(rt.kgWeek)+" كجم في الأسبوع). نزّل 100–150 سعرة عشان الزيادة تبقى عضل أكتر من دهون."});
    else if(g==="gain") out.push({t:"good",x:"معدل زيادتك ("+r1(rt.kgWeek)+" كجم في الأسبوع) في المعدل المناسب للتضخيم النضيف."});
    if(g==="maintain" && Math.abs(rt.pct)>0.4) out.push({t:"warn",x:"وزنك بيتغير "+r1(rt.kgWeek)+" كجم في الأسبوع وهدفك تثبيت. عدّل السعرات 100–150."});
    if(g==="cut" && rt.pct>-0.2) out.push({t:"warn",x:"الوزن مش بينزل بما يكفي. قلّل 100–150 سعرة."});
    if(g==="cut" && rt.pct<-1) out.push({t:"warn",x:"بتنزل بسرعة. زوّد السعرات شوية عشان تحافظ على العضل."});
  }
  if(weekTrainCount(ws)>=4) out.push({t:"good",x:"أسبوع كامل: 4 من 4 تمارين. ده اللي بيبني."});
  var pr=null; S.sessions.forEach(function(s){ if(s.pr && s.pr.length && diffD(t,s.date)<=3 && !pr) pr=s; });
  if(pr) out.push({t:"good",x:"رقم قياسي جديد في "+pr.pr.map(exName).join("، ")+". عاش."});
  var st=curStreak(); if(st>=3) out.push({t:"good",x:st+" أيام متتالية جيدة. كمّل."});
  if(dayInfo(t).score===dayInfo(t).total) out.push({t:"good",x:"خلّصت كل مهام النهارده."});
  var order={warn:0,good:1,info:2};
  out.sort(function(a,b){ return order[a.t]-order[b.t]; });
  return out.slice(0,5);
}
function badgesList(){
  var cnt=S.sessions.filter(function(s){ var d=dayOf(s.day); return d && !d.rest; }).length;
  var prs=0; S.sessions.forEach(function(s){ if(s.pr) prs+=s.pr.length; });
  return [

document.addEventListener("click", function(ev){
  var b=ev.target.closest("[data-act]"); if(!b) return;
  var a=b.getAttribute("data-act");
  if(a==="gotrain"){ dayIdx=+b.getAttribute("data-i"); S.prefs.day=dayIdx; persist(); view="train"; renderAll(); window.scrollTo(0,0); }
  else if(a==="habit"){ var k=todayKey(), id=b.getAttribute("data-h"); S.habits[k]=S.habits[k]||{}; S.habits[k][id]=!S.habits[k][id]; persist(); renderAll(); }
  else if(a==="prayer"){ var k=todayKey(), id=b.getAttribute("data-p"); S.prayers[k]=S.prayers[k]||{}; S.prayers[k][id]=!S.prayers[k][id]; persist(); renderAll(); }
  else if(a==="qwsave"){ if(saveWeight($("qw").value,todayKey())) renderAll(); }
  else if(a==="wsave"){ if(saveWeight($("wval").value,$("wdate").value||todayKey())) renderAll(); }
  else if(a==="wdel"){ delete S.weights[b.getAttribute("data-k")]; persist(); renderAll(); }
  else if(a==="wr"){ S.prefs.wr=+b.getAttribute("data-r"); persist(); renderAll(); }

    var e={date:$("m-date").value||todayKey()}, any=false;
    ["arm","chest","waist","thigh","sh"].forEach(function(f){
      var v=parseFloat(($("m-"+f).value||"").replace(",","."));
      if(v>10 && v<250){ e[f]=r1(v); any=true; }
    });
    if(!any){ toast("اكتب قياس واحد على الأقل بالسنتيمتر"); return; }
    S.meas=S.meas.filter(function(m){ return m.date!==e.date; }); S.meas.push(e);
    S.meas.sort(function(x,y){ return x.date<y.date?-1:1; });
    persist(); toast("اتسجلت القياسات"); renderAll();
  }
  else if(a==="mdel"){ var dd=b.getAttribute("data-d"); S.meas=S.meas.filter(function(m){ return m.date!==dd; }); persist(); renderAll(); }
  
  else if(a==="dlimg"){
    if(!shareCanvas){ toast("استنى الصورة تجهز"); return; }
    shareCanvas.toBlob(function(bl){ if(!bl){ toast("حصلت مشكلة في الصورة"); return; } saveFile("ملخص-الأسبوع-"+weekStartKey(todayKey())+".png",bl,"اتنزّلت الصورة"); },"image/png");
  }
  else if(a==="restoretext"){ var rt = $("rtext"); tryRestore(rt ? rt.value : ""); }
  else if(a==="restorecancel"){ pendingRestore = null; restoreMsg = ""; renderShare(); }
  else if(a==="restoreok"){
    var o = pendingRestore; pendingRestore = null; restoreMsg = "اتسترجعت البيانات.";
    o.sessions.sort(function(x,y){ return x.date<y.date?1:x.date>y.date?-1:(y.id||0)-(x.id||0); });
    S = o; S.prefs = S.prefs || {day:0,rest:150}; S.prayers=S.prayers||{}; S.draft = S.draft || {}; defaults();
    persist(); if(cloudDb){ clearTimeout(cloudTimer); cloudPush(true); }
    renderAll(); toast("اتسترجعت البيانات");
  }

});
